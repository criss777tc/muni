<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administración — Municipalidad de El Carril</title>
  <meta name="description" content="Panel de acceso para administradores de la Municipalidad de El Carril.">
  <link rel="stylesheet" href="admin2.css">
  <script src="admin2.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Fondo animado -->
  <div class="bg-shapes" aria-hidden="true">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <!-- Tarjeta de login -->
  <main class="login-wrapper">

    <!-- Encabezado de la tarjeta -->
    <div class="login-header">
      <div class="login-logo-wrap">
        <img src="imagenes/logo1.png" alt="Logo Municipalidad de El Carril" class="login-logo">
      </div>
      <h1 class="login-title">Municipalidad de El Carril</h1>
      <p class="login-subtitle">Panel de Administración</p>
    </div>

    <!-- Separador -->
    <div class="login-divider" aria-hidden="true"></div>

    <!-- Formulario -->
    <form id="login" class="login-form" autocomplete="off" novalidate>
      <div class="login-badge">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
        </svg>
        Acceso seguro
      </div>

      <div class="input-group">
        <label for="usuario" class="input-label">Usuario</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
            </svg>
          </span>
          <input
            type="text"
            id="usuario"
            class="input-field"
            placeholder="Ingresá tu usuario"
            required
            autocomplete="username"
          >
        </div>
      </div>

      <div class="input-group">
        <label for="password" class="input-label">Contraseña</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
            </svg>
          </span>
          <input
            type="password"
            id="password"
            class="input-field"
            placeholder="Ingresá tu contraseña"
            required
            autocomplete="current-password"
          >
          <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Mostrar/ocultar contraseña" tabindex="0">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
              <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="login-error" class="login-error" role="alert" aria-live="polite"></div>

      <button type="submit" class="btn-login" id="btn-login">
        <span class="btn-text">Ingresar</span>
        <span class="btn-spinner" aria-hidden="true"></span>
        <svg class="btn-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
          <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/>
        </svg>
      </button>
    </form>

    <!-- Pie de tarjeta -->
    <footer class="login-footer">
      <a href="index.html" class="login-back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
          <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
        </svg>
        Volver al sitio principal
      </a>
    </footer>

  </main>

</body>

</html>
